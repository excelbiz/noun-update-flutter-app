name: noun_update_student_app
description: Native NOUN Update student companion for Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.2
  onesignal_flutter: ^5.6.8
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/noun_update_logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/images/noun_update_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/noun_update_logo.png
  min_sdk_android: 21
