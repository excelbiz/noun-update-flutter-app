name: Build NOUN UPDATE APK for Appetize

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Create clean Flutter app
        run: |
          rm -rf app
          flutter create app --platforms=android --org com.nounupdate

      - name: Write NOUN UPDATE preview app
        run: |
          cat > app/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const NounUpdateApp());
          }

          class NounUpdateApp extends StatelessWidget {
            const NounUpdateApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'NOUN UPDATE',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF006B3F)),
                  scaffoldBackgroundColor: const Color(0xFFF6FAF7),
                  fontFamily: 'Roboto',
                ),
                home: const MainShell(),
              );
            }
          }

          class MainShell extends StatefulWidget {
            const MainShell({super.key});

            @override
            State<MainShell> createState() => _MainShellState();
          }

          class _MainShellState extends State<MainShell> {
            int index = 0;

            final screens = const [
              HomeScreen(),
              UpdatesScreen(),
              ResourcesScreen(),
              ToolsScreen(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(index: index, children: screens),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: index,
                  onDestinationSelected: (value) => setState(() => index = value),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.home_outlined), selectedIcon: Icon(Icons.home), label: 'Home'),
                    NavigationDestination(icon: Icon(Icons.campaign_outlined), selectedIcon: Icon(Icons.campaign), label: 'Updates'),
                    NavigationDestination(icon: Icon(Icons.widgets_outlined), selectedIcon: Icon(Icons.widgets), label: 'Resources'),
                    NavigationDestination(icon: Icon(Icons.build_outlined), selectedIcon: Icon(Icons.build), label: 'Tools'),
                  ],
                ),
              );
            }
          }

          const primary = Color(0xFF006B3F);
          const dark = Color(0xFF053B28);
          const gold = Color(0xFFFFC857);

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: ListView(
                  padding: const EdgeInsets.all(18),
                  children: const [
                    HeroCard(),
                    SizedBox(height: 22),
                    SectionTitle('Today on NOUN UPDATE', 'Important student information, portal alerts and academic guides.'),
                    SizedBox(height: 12),
                    UpdateCard(title: '2026_1 result monitoring', body: 'Students can follow verified updates and know when new results or faculty-specific updates are released.', urgent: true),
                    UpdateCard(title: 'Admission support', body: 'Prospects can use eligibility tools, programme guides, study centre information and admission resources.'),
                    SizedBox(height: 22),
                    SectionTitle('Quick Student Tools', 'Fast access to the most used NOUN UPDATE resources.'),
                    SizedBox(height: 12),
                    ResourceGrid(limit: 6),
                  ],
                ),
              );
            }
          }

          class HeroCard extends StatelessWidget {
            const HeroCard({super.key});

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(colors: [primary, dark], begin: Alignment.topLeft, end: Alignment.bottomRight),
                  borderRadius: BorderRadius.circular(30),
                  boxShadow: [BoxShadow(color: primary.withOpacity(.25), blurRadius: 22, offset: const Offset(0, 12))],
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        Container(
                          width: 52,
                          height: 52,
                          decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(18)),
                          child: const Center(child: Text('NU', style: TextStyle(color: primary, fontWeight: FontWeight.w900, fontSize: 20))),
                        ),
                        const SizedBox(width: 12),
                        const Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('NOUN UPDATE', style: TextStyle(color: Colors.white, fontWeight: FontWeight.w900, fontSize: 19)),
                              Text('Native mobile companion', style: TextStyle(color: Colors.white70, fontWeight: FontWeight.w600)),
                            ],
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 22),
                    const Text('Stay informed. Study smarter. Prepare better.', style: TextStyle(color: Colors.white, fontSize: 30, height: 1.05, fontWeight: FontWeight.w900)),
                    const SizedBox(height: 10),
                    const Text('A native Flutter app for NOUN students and staff: updates, resources, exam summary, mock, fees, results, materials, programmes and study centres.', style: TextStyle(color: Colors.white70, height: 1.4)),
                    const SizedBox(height: 18),
                    TextField(
                      textCapitalization: TextCapitalization.characters,
                      decoration: InputDecoration(
                        hintText: 'Search course code e.g. GST101',
                        filled: true,
                        fillColor: Colors.white,
                        prefixIcon: const Icon(Icons.search),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(18), borderSide: BorderSide.none),
                      ),
                    ),
                    const SizedBox(height: 12),
                    Wrap(
                      spacing: 8,
                      runSpacing: 8,
                      children: const [
                        MiniChip('Materials', Icons.menu_book),
                        MiniChip('Past Questions', Icons.history_edu),
                        MiniChip('Mock', Icons.quiz),
                        MiniChip('Result', Icons.fact_check),
                      ],
                    ),
                  ],
                ),
              );
            }
          }

          class MiniChip extends StatelessWidget {
            final String label;
            final IconData icon;
            const MiniChip(this.label, this.icon, {super.key});

            @override
            Widget build(BuildContext context) {
              return ActionChip(
                avatar: Icon(icon, color: primary, size: 18),
                label: Text(label),
                backgroundColor: Colors.white,
                labelStyle: const TextStyle(fontWeight: FontWeight.w800),
                onPressed: () => showToast(context, '$label will open the NOUN UPDATE page in the live app.'),
              );
            }
          }

          class UpdatesScreen extends StatelessWidget {
            const UpdatesScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: ListView(
                  padding: const EdgeInsets.all(18),
                  children: const [
                    SectionTitle('NOUN Updates', 'Verified updates from NOUN, student alerts and NOUN UPDATE announcements.'),
                    SizedBox(height: 12),
                    UpdateCard(title: 'Result and portal alerts', body: 'Push-style update feed for result releases, portal changes, non-examinable course updates and faculty announcements.', urgent: true),
                    UpdateCard(title: 'Admission and registration updates', body: 'Information for freshers, returning students, programme requirements, study centres and semester registration.'),
                    UpdateCard(title: 'Exam preparation notices', body: 'Mock, exam summary, past questions, TMA revision and course material reminders.'),
                    UpdateCard(title: 'Staff and support desk information', body: 'Resource links for study centre information, programme guide, official NOUN website and student support.'),
                  ],
                ),
              );
            }
          }

          class ResourcesScreen extends StatelessWidget {
            const ResourcesScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: ListView(
                  padding: const EdgeInsets.all(18),
                  children: const [
                    SectionTitle('Resource Centre', 'All major NOUN UPDATE pages arranged for quick mobile access.'),
                    SizedBox(height: 12),
                    ResourceGrid(limit: 50),
                  ],
                ),
              );
            }
          }

          class ToolsScreen extends StatelessWidget {
            const ToolsScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    const SectionTitle('Smart Tools', 'Fast launchers for students, prospects and staff.'),
                    const SizedBox(height: 14),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(18),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Course Quick Launch', style: TextStyle(fontWeight: FontWeight.w900, fontSize: 18)),
                            const SizedBox(height: 10),
                            TextField(
                              textCapitalization: TextCapitalization.characters,
                              decoration: InputDecoration(
                                hintText: 'Enter course code e.g. GST101',
                                prefixIcon: const Icon(Icons.search),
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(18)),
                              ),
                            ),
                            const SizedBox(height: 12),
                            Wrap(
                              spacing: 8,
                              runSpacing: 8,
                              children: const [
                                ToolButton('Materials', Icons.menu_book),
                                ToolButton('Past Qs', Icons.history_edu),
                                ToolButton('Summary', Icons.summarize),
                                ToolButton('Mock', Icons.quiz),
                                ToolButton('TMA', Icons.assignment_turned_in),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    const ActionTile('Fee Checker', 'Estimate semester fee, course fee, exam fee and units.', Icons.payments),
                    const ActionTile('Result Checker', 'Check results and analyse academic performance.', Icons.fact_check),
                    const ActionTile('CGPA Calculator', 'Calculate GPA and CGPA for planning.', Icons.calculate),
                    const ActionTile('Smart Eligibility Finder', 'Know available programmes based on credentials.', Icons.verified_user),
                    const ActionTile('Project Topic Generator', 'Generate project and seminar topic ideas.', Icons.tips_and_updates),
                  ],
                ),
              );
            }
          }

          class ToolButton extends StatelessWidget {
            final String label;
            final IconData icon;
            const ToolButton(this.label, this.icon, {super.key});

            @override
            Widget build(BuildContext context) {
              return FilledButton.tonalIcon(
                onPressed: () => showToast(context, '$label launcher ready for live link connection.'),
                icon: Icon(icon, size: 18),
                label: Text(label),
              );
            }
          }

          class ActionTile extends StatelessWidget {
            final String title;
            final String subtitle;
            final IconData icon;
            const ActionTile(this.title, this.subtitle, this.icon, {super.key});

            @override
            Widget build(BuildContext context) {
              return Card(
                child: ListTile(
                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                  leading: CircleAvatar(backgroundColor: primary.withOpacity(.1), foregroundColor: primary, child: Icon(icon)),
                  title: Text(title, style: const TextStyle(fontWeight: FontWeight.w900)),
                  subtitle: Text(subtitle),
                  trailing: const Icon(Icons.arrow_forward_ios, size: 16),
                  onTap: () => showToast(context, '$title will open the live NOUN UPDATE tool.'),
                ),
              );
            }
          }

          class SectionTitle extends StatelessWidget {
            final String title;
            final String subtitle;
            const SectionTitle(this.title, this.subtitle, {super.key});

            @override
            Widget build(BuildContext context) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(title, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w900, color: dark)),
                  const SizedBox(height: 4),
                  Text(subtitle, style: const TextStyle(color: Colors.black54, height: 1.35)),
                ],
              );
            }
          }

          class UpdateCard extends StatelessWidget {
            final String title;
            final String body;
            final bool urgent;
            const UpdateCard({required this.title, required this.body, this.urgent = false, super.key});

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 12),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Wrap(
                        spacing: 8,
                        children: [
                          Chip(label: Text(urgent ? 'Important' : 'Update'), backgroundColor: urgent ? gold.withOpacity(.35) : primary.withOpacity(.1)),
                          const Chip(label: Text('NOUN UPDATE')),
                        ],
                      ),
                      const SizedBox(height: 8),
                      Text(title, style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 18)),
                      const SizedBox(height: 6),
                      Text(body, style: const TextStyle(color: Colors.black54, height: 1.35)),
                    ],
                  ),
                ),
              );
            }
          }

          class ResourceGrid extends StatelessWidget {
            final int limit;
            const ResourceGrid({required this.limit, super.key});

            @override
            Widget build(BuildContext context) {
              final items = resources.take(limit).toList();
              return GridView.builder(
                shrinkWrap: true,
                physics: const NeverScrollableScrollPhysics(),
                itemCount: items.length,
                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                  crossAxisCount: 2,
                  mainAxisSpacing: 12,
                  crossAxisSpacing: 12,
                  childAspectRatio: .82,
                ),
                itemBuilder: (context, index) => ResourceCard(item: items[index]),
              );
            }
          }

          class ResourceCard extends StatelessWidget {
            final Resource item;
            const ResourceCard({required this.item, super.key});

            @override
            Widget build(BuildContext context) {
              return Card(
                child: InkWell(
                  borderRadius: BorderRadius.circular(18),
                  onTap: () => showToast(context, '${item.title} will connect to ${item.url}'),
                  child: Padding(
                    padding: const EdgeInsets.all(14),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        CircleAvatar(backgroundColor: primary.withOpacity(.1), foregroundColor: primary, child: Icon(item.icon)),
                        const SizedBox(height: 12),
                        Text(item.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w900)),
                        const SizedBox(height: 6),
                        Expanded(child: Text(item.desc, maxLines: 4, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.black54, fontSize: 12, height: 1.25))),
                        Row(children: [Text(item.group, style: const TextStyle(color: primary, fontWeight: FontWeight.w800, fontSize: 11)), const Spacer(), const Icon(Icons.arrow_outward, size: 16)]),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class Resource {
            final String title;
            final String desc;
            final String group;
            final String url;
            final IconData icon;
            const Resource(this.title, this.desc, this.group, this.url, this.icon);
          }

          const resources = [
            Resource('Latest NOUN Updates', 'Academic notices, result alerts and portal news.', 'Updates', 'nounupdate.com', Icons.campaign),
            Resource('Exam Summary', 'Request simplified course summaries for revision.', 'Exam Prep', 'nounupdate.com/exam-summary', Icons.summarize),
            Resource('Mock Practice', 'Practice e-exam style questions.', 'Exam Prep', 'nounupdate.com/mock', Icons.quiz),
            Resource('Past Questions', 'Download POP and e-exam past questions.', 'Exam Prep', 'nounupdate.com/past-questions', Icons.history_edu),
            Resource('Course Materials', 'Find course materials and study aids.', 'Study', 'nounupdate.com/course-materials', Icons.menu_book),
            Resource('Past TMA Questions', 'Revise with previous TMA questions.', 'Study', 'nounupdate.com/tma', Icons.assignment_turned_in),
            Resource('Fee Checker', 'Estimate fees, units and registration costs.', 'Registration', 'nounupdate.com/fee-check', Icons.payments),
            Resource('Result Checker', 'Check result status and academic records.', 'Results', 'nounupdate.com/result', Icons.fact_check),
            Resource('CGPA Calculator', 'Calculate GPA and CGPA.', 'Results', 'nounupdate.com/cgpa-calculator', Icons.calculate),
            Resource('Study Planner', 'Plan weekly study and revision.', 'Study', 'nounupdate.com/study-planner', Icons.calendar_month),
            Resource('Programmes', 'Explore available NOUN programmes.', 'Admission', 'nounupdate.com/noun-programmes', Icons.account_tree),
            Resource('Eligibility Finder', 'Check programme eligibility before admission.', 'Admission', 'nounupdate.com/smart-eligibility-finder', Icons.verified_user),
            Resource('Study Centres', 'Find study centres and addresses.', 'Admission', 'nounupdate.com/study-centre', Icons.location_city),
            Resource('Graduation Checker', 'Check graduation and convocation status.', 'Results', 'nounupdate.com/graduation', Icons.workspace_premium),
            Resource('Project Topic Generator', 'Generate project and seminar topics.', 'Project', 'nounupdate.com/project-topic-generator', Icons.tips_and_updates),
            Resource('Project Slip', 'Generate and manage project slip.', 'Project', 'nounupdate.com/generate-project-slip', Icons.receipt_long),
          ];

          void showToast(BuildContext context, String message) {
            ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
          }
          DART

      - name: Build debug APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Prepare Appetize APK
        run: |
          mkdir -p appetize_upload
          cp app/build/app/outputs/flutter-apk/app-debug.apk appetize_upload/noun_update_appetize.apk
          ls -lh appetize_upload/noun_update_appetize.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noun-update-appetize-apk
          path: appetize_upload/noun_update_appetize.apk
