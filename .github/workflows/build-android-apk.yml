name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: >-
          flutter create
          --platforms=android
          --org com.nounupdate
          --project-name noun_update_student_app
          .

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Android branding
        run: |
          sed -i 's/android:label="noun_update_student_app"/android:label="NOUN Update"/' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons

      - name: Run tests
        run: flutter test

      - name: Build installable APK
        run: >-
          flutter build apk
          --debug
          --dart-define=ENABLE_DEMO_FALLBACK=true

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/NOUN-Update-Student-App-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noun-update-android-apk
          path: dist/NOUN-Update-Student-App-debug.apk
          if-no-files-found: error
          retention-days: 14
