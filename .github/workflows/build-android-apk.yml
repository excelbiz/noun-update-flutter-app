name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, sign and verify release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: |
          flutter create \
            --platforms=android \
            --org com.nounupdate \
            --project-name noun_update_student_app \
            .
          rm -f test/widget_test.dart

      - name: Fetch current website logo
        run: |
          python -m pip install Pillow
          python tools/prepare_brand_assets.py

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Android branding
        run: |
          sed -i 's/android:label="noun_update_student_app"/android:label="NOUN Update"/' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY

      - name: Analyse live app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build physical-device APKs
        run: >-
          flutter build apk
          --release
          --target-platform android-arm,android-arm64
          --dart-define=ENABLE_DEMO_FALLBACK=false

      - name: Preserve universal APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NOUN-Update-Student-App-universal.apk

      - name: Build smaller per-device APKs
        run: >-
          flutter build apk
          --release
          --split-per-abi
          --target-platform android-arm,android-arm64
          --dart-define=ENABLE_DEMO_FALLBACK=false

      - name: Stage per-device APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/NOUN-Update-Student-App-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/NOUN-Update-Student-App-arm32.apk

      - name: Verify signatures and compatibility
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          "$AAPT" dump badging dist/NOUN-Update-Student-App-universal.apk | tee dist/package-info.txt
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: noun-update-verified-android-apks
          path: dist/
          if-no-files-found: error
          retention-days: 14

